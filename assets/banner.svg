<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <!-- Accent gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="50%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#f472b6"/>
    </linearGradient>
    <!-- DNA strand gradient -->
    <linearGradient id="dnaGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="dnaGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f472b6"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" rx="12" fill="url(#bgGrad)"/>
  <!-- Subtle border -->
  <rect width="898" height="218" x="1" y="1" rx="11" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.4"/>

  <!-- Animated floating particles -->
  <circle cx="80" cy="40" r="2" fill="#58a6ff" opacity="0.5">
    <animate attributeName="cy" values="40;30;40" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="180" r="1.5" fill="#a78bfa" opacity="0.4">
    <animate attributeName="cy" values="180;165;180" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="750" cy="50" r="2.5" fill="#f472b6" opacity="0.3">
    <animate attributeName="cy" values="50;35;50" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="830" cy="170" r="1.8" fill="#34d399" opacity="0.4">
    <animate attributeName="cy" values="170;155;170" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="25" r="1.2" fill="#fbbf24" opacity="0.3">
    <animate attributeName="cy" values="25;15;25" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="620" cy="195" r="2" fill="#58a6ff" opacity="0.35">
    <animate attributeName="cy" values="195;180;195" dur="5.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;0.85;0.35" dur="5.5s" repeatCount="indefinite"/>
  </circle>

  <!-- DNA Double Helix (left side) -->
  <g transform="translate(60, 110)" filter="url(#glow)">
    <!-- Strand 1 -->
    <path d="M0,0 Q15,-40 30,0 Q45,40 60,0 Q75,-40 90,0 Q105,40 120,0" 
          fill="none" stroke="url(#dnaGrad1)" stroke-width="3" stroke-linecap="round">
      <animate attributeName="d" 
        values="M0,0 Q15,-40 30,0 Q45,40 60,0 Q75,-40 90,0 Q105,40 120,0;
                M0,0 Q15,40 30,0 Q45,-40 60,0 Q75,40 90,0 Q105,-40 120,0;
                M0,0 Q15,-40 30,0 Q45,40 60,0 Q75,-40 90,0 Q105,40 120,0"
        dur="6s" repeatCount="indefinite"/>
    </path>
    <!-- Strand 2 -->
    <path d="M0,0 Q15,40 30,0 Q45,-40 60,0 Q75,40 90,0 Q105,-40 120,0" 
          fill="none" stroke="url(#dnaGrad2)" stroke-width="3" stroke-linecap="round">
      <animate attributeName="d" 
        values="M0,0 Q15,40 30,0 Q45,-40 60,0 Q75,40 90,0 Q105,-40 120,0;
                M0,0 Q15,-40 30,0 Q45,40 60,0 Q75,-40 90,0 Q105,40 120,0;
                M0,0 Q15,40 30,0 Q45,-40 60,0 Q75,40 90,0 Q105,-40 120,0"
        dur="6s" repeatCount="indefinite"/>
    </path>
    <!-- Base pair rungs -->
    <line x1="15" y1="-18" x2="15" y2="18" stroke="#58a6ff" stroke-width="1.5" opacity="0.5">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="45" y1="-18" x2="45" y2="18" stroke="#a78bfa" stroke-width="1.5" opacity="0.5">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    </line>
    <line x1="75" y1="-18" x2="75" y2="18" stroke="#f472b6" stroke-width="1.5" opacity="0.5">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" begin="1s" repeatCount="indefinite"/>
    </line>
    <line x1="105" y1="-18" x2="105" y2="18" stroke="#34d399" stroke-width="1.5" opacity="0.5">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- DNA Double Helix (right side, mirrored) -->
  <g transform="translate(720, 110)" filter="url(#glow)">
    <path d="M0,0 Q15,-35 30,0 Q45,35 60,0 Q75,-35 90,0 Q105,35 120,0" 
          fill="none" stroke="url(#dnaGrad1)" stroke-width="3" stroke-linecap="round">
      <animate attributeName="d" 
        values="M0,0 Q15,-35 30,0 Q45,35 60,0 Q75,-35 90,0 Q105,35 120,0;
                M0,0 Q15,35 30,0 Q45,-35 60,0 Q75,35 90,0 Q105,-35 120,0;
                M0,0 Q15,-35 30,0 Q45,35 60,0 Q75,-35 90,0 Q105,35 120,0"
        dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M0,0 Q15,35 30,0 Q45,-35 60,0 Q75,35 90,0 Q105,-35 120,0" 
          fill="none" stroke="url(#dnaGrad2)" stroke-width="3" stroke-linecap="round">
      <animate attributeName="d" 
        values="M0,0 Q15,35 30,0 Q45,-35 60,0 Q75,35 90,0 Q105,-35 120,0;
                M0,0 Q15,-35 30,0 Q45,35 60,0 Q75,-35 90,0 Q105,35 120,0;
                M0,0 Q15,35 30,0 Q45,-35 60,0 Q75,35 90,0 Q105,-35 120,0"
        dur="6s" repeatCount="indefinite"/>
    </path>
    <line x1="15" y1="-16" x2="15" y2="16" stroke="#34d399" stroke-width="1.5" opacity="0.5">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" begin="0.3s" repeatCount="indefinite"/>
    </line>
    <line x1="45" y1="-16" x2="45" y2="16" stroke="#f472b6" stroke-width="1.5" opacity="0.5">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" begin="0.8s" repeatCount="indefinite"/>
    </line>
    <line x1="75" y1="-16" x2="75" y2="16" stroke="#a78bfa" stroke-width="1.5" opacity="0.5">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" begin="1.3s" repeatCount="indefinite"/>
    </line>
    <line x1="105" y1="-16" x2="105" y2="16" stroke="#58a6ff" stroke-width="1.5" opacity="0.5">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" begin="1.8s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Hourglass / infinity symbol (center icon) -->
  <g transform="translate(450, 68)" filter="url(#softGlow)">
    <text font-family="Segoe UI Emoji, Apple Color Emoji, sans-serif" font-size="38" text-anchor="middle" fill="url(#accentGrad)">
      🧬
    </text>
  </g>

  <!-- Title text -->
  <text x="450" y="115" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="700" fill="url(#accentGrad)" filter="url(#glow)">
    Awesome Longevity Therapeutics Modeler
  </text>

  <!-- Subtitle -->
  <text x="450" y="145" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" fill="#8b949e" font-weight="400">
    Interview Questions &amp; Answers — Geroscience × Computation × Drug Discovery
  </text>

  <!-- Animated underline -->
  <line x1="220" y1="160" x2="680" y2="160" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.6">
    <animate attributeName="x1" values="220;300;220" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="680;600;680" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="8s" repeatCount="indefinite"/>
  </line>

  <!-- Badge-like stats -->
  <g transform="translate(310, 180)">
    <rect width="85" height="24" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="42" y="16" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#58a6ff">📝 136 Q&amp;A</text>
  </g>
  <g transform="translate(408, 180)">
    <rect width="85" height="24" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="42" y="16" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#a78bfa">📂 11 Topics</text>
  </g>
  <g transform="translate(506, 180)">
    <rect width="95" height="24" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="47" y="16" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#34d399">⚗️ Geroscience</text>
  </g>
</svg>
